  );
}

// ================= СТАТИСТИКА =================
function PageStats({ cows, showToast }) {
  const [period, setPeriod] = useState("week");
  const [metric, setMetric] = useState("act");
  const [selectedBar, setSelectedBar] = useState(null);

  const periods = [
    { id: "week", l: "Неделя" },
    { id: "month", l: "Месяц" },
    { id: "half", l: "Полгода" },
    { id: "year", l: "Год" },
  ];
  const metrics = [
    { id: "act", l: "Активность", u: "шаг/мин" },
    { id: "hr", l: "Пульс", u: "уд/мин" },
    { id: "temp", l: "Температура", u: "°C" },
  ];

  const allStats = cows.flatMap(c => c.stats[period]);
  const avg = Math.round(allStats.reduce((a, b) => a + b, 0) / allStats.length);
  const max = Math.max(...allStats);
  const min = Math.min(...allStats);
  const visible = allStats.slice(0, period === "week" ? 7 : period === "year" ? 12 : 30);

  const exportCSV = () => {
    const rows = [["ID", "Кличка", "Порода", "Пульс", "Температура", "Здоровье", "Статус"]];
    cows.forEach(c => rows.push([
      c.id, c.name, c.breed, c.vitals.hr, c.vitals.temp,
      c.health.score, c.inside ? "В загоне" : "Вне",
    ]));
    const csv = rows.map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `herd-stats-${period}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("CSV-файл скачан", "success");
  };

  return (
    <div style={{ background: P.bg, minHeight: "100vh", padding: "40px" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
          <div>
            <div style={{ fontSize: 32, fontWeight: 800, color: P.dark }}>📊 Статистика</div>
            <div style={{ fontSize: 14, color: P.gray, marginTop: 4 }}>Обзор по всем стадам</div>
          </div>
          <button onClick={exportCSV} style={{
            background: P.dark, color: P.white, padding: "12px 20px", border: "none",
            borderRadius: 12, fontWeight: 700, fontSize: 13, cursor: "pointer",
          }}>📤 Экспорт CSV</button>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          {periods.map(p => (
            <div key={p.id} onClick={() => { setPeriod(p.id); setSelectedBar(null); }}
              style={{
                padding: "12px 22px", borderRadius: 12, cursor: "pointer",
                background: period === p.id ? P.dark : P.white,
                color: period === p.id ? P.white : P.dark,
                fontSize: 13, fontWeight: 700,
              }}>{p.l}</div>
          ))}
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
          {metrics.map(m => (
            <div key={m.id} onClick={() => setMetric(m.id)}
              style={{
                padding: "10px 18px", borderRadius: 10, cursor: "pointer",
                background: metric === m.id ? P.mint : P.white,
                color: P.dark, fontSize: 12, fontWeight: 700,
                border: metric === m.id ? `2px solid ${P.dark}` : "2px solid transparent",
              }}>{m.l}</div>
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16, marginBottom: 24 }}>
          {[
            { l: "Среднее", v: avg, c: P.mint },
            { l: "Максимум", v: max, c: P.peach },
            { l: "Минимум", v: min, c: P.lavender },
          ].map((s, i) => (
            <div key={i} style={{ background: s.c, borderRadius: 16, padding: 24, textAlign: "center" }}>
              <div style={{ fontSize: 12, color: P.dark, opacity: 0.7 }}>{s.l}</div>
              <div style={{ fontSize: 42, fontWeight: 900, color: P.dark, marginTop: 4 }}>{s.v}</div>
            </div>
          ))}
        </div>

        <div style={{ background: P.white, borderRadius: 16, padding: 24, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: P.dark }}>
              {metrics.find(m => m.id === metric).l} ({metrics.find(m => m.id === metric).u})
            </div>
            {selectedBar !== null && (
              <div style={{ fontSize: 12, color: P.dark, background: P.mint, padding: "6px 12px", borderRadius: 8, fontWeight: 700 }}>
                Точка #{selectedBar + 1}: <b>{visible[selectedBar]}</b>
              </div>
            )}
          </div>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 200 }}>
            {visible.map((v, i) => {
              const h = ((v - min) / (max - min || 1)) * 100;
              const isSelected = selectedBar === i;
              return (
                <div key={i} onClick={() => setSelectedBar(i)}
                  style={{
                    flex: 1, height: `${Math.max(h, 8)}%`, cursor: "pointer",
                    background: isSelected
                      ? `linear-gradient(180deg, ${P.amber}, ${P.red})`
                      : `linear-gradient(180deg, ${P.mint}, ${P.green})`,
                    borderRadius: "4px 4px 0 0",
                    transition: "all 0.2s",
                  }} />
              );
            })}
          </div>
        </div>

        <div style={{ background: P.white, borderRadius: 16, padding: 24 }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: P.dark, marginBottom: 16 }}>По стадам</div>
          {INITIAL_HERDS.map(h => {
            const hc = cows.filter(c => c.herdId === h.id);
            const vals = hc.flatMap(c => c.stats[period]);
            const a = vals.length ? Math.round(vals.reduce((x, y) => x + y, 0) / vals.length) : 0;
            const percent = max > 0 ? (a / max) * 100 : 0;
            return (
              <div key={h.id} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: P.dark }}>{h.name}</div>
                  <div style={{ fontSize: 15, fontWeight: 800, color: P.dark }}>{a}</div>
                </div>
                <div style={{ height: 10, background: P.sage, borderRadius: 5, overflow: "hidden" }}>
                  <div style={{
                    width: `${percent}%`, height: "100%",
                    background: h.accent, borderRadius: 5,
                    transition: "width 0.6s",
                  }} />
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

