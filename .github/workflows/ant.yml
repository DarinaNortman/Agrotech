// ================= ДАШБОРД =================
function PageDashboard({ cows, herds, onAddCow, showToast }) {
  const [herd, setHerd] = useState(null);
  const [cow, setCow] = useState(null);
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all");
  const [sort, setSort] = useState("id");
  const [tab, setTab] = useState("vitals");
  const [addOpen, setAddOpen] = useState(false);

  if (cow) {
    return <CowDetail
      cow={cow} cows={cows} tab={tab} setTab={setTab}
      onBack={() => setCow(null)}
      onUpdate={(updated) => {
        // обновление через родителя
        const idx = cows.findIndex(c => c.id === updated.id);
        if (idx >= 0) cows[idx] = updated;
        setCow({ ...updated });
        showToast("Данные обновлены", "success");
      }}
      showToast={showToast}
    />;
  }

  if (herd) {
    // Фильтрация и сортировка
    let list = cows.filter(c => c.herdId === herd.id);
    if (search) {
      const s = search.toLowerCase();
      list = list.filter(c =>
        c.name.toLowerCase().includes(s) ||
        String(c.id).includes(s) ||
        c.earTag.toLowerCase().includes(s)
      );
    }
    if (filter === "inside") list = list.filter(c => c.inside);
    if (filter === "outside") list = list.filter(c => !c.inside);
    if (filter === "sick") list = list.filter(c => c.health.score < 70);
    list = [...list].sort((a, b) => {
      if (sort === "id") return a.id - b.id;
      if (sort === "name") return a.name.localeCompare(b.name);
      if (sort === "health") return b.health.score - a.health.score;
      return 0;
    });

    return (
      <div style={{ background: P.bg, minHeight: "100vh", padding: "40px" }}>
        <div style={{ maxWidth: 1200, margin: "0 auto" }}>
          <div onClick={() => setHerd(null)} style={{
            cursor: "pointer", color: P.gray, fontSize: 13, marginBottom: 12, fontWeight: 600,
          }}>← Все стада</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <div>
              <div style={{ fontSize: 32, fontWeight: 800, color: P.dark }}>{herd.name}</div>
              <div style={{ fontSize: 14, color: P.gray, marginTop: 4 }}>
                {cows.filter(c => c.herdId === herd.id).length} животных · {herd.location}
              </div>
            </div>
            <button onClick={() => setAddOpen(true)} style={{
              background: P.dark, color: P.white, padding: "12px 20px", border: "none",
              borderRadius: 12, fontWeight: 700, fontSize: 13, cursor: "pointer",
            }}>➕ Добавить корову</button>
          </div>

          {/* Панель фильтров */}
          <div style={{
            background: P.white, borderRadius: 16, padding: 16, marginBottom: 20,
            display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap",
          }}>
            <input
              type="text" placeholder="🔍 Поиск по кличке, ID или бирке..."
              value={search} onChange={e => setSearch(e.target.value)}
              style={{
                flex: 1, minWidth: 200, padding: "10px 14px",
                border: `2px solid ${P.sage}`, borderRadius: 10, fontSize: 13,
                outline: "none", color: P.dark,
              }}
            />
            <div style={{ display: "flex", gap: 4 }}>
              {[
                { id: "all", l: "Все" },
                { id: "inside", l: "В загоне" },
                { id: "outside", l: "Вне" },
                { id: "sick", l: "Больные" },
              ].map(f => (
                <div key={f.id} onClick={() => setFilter(f.id)}
                  style={{
                    padding: "8px 14px", borderRadius: 10, cursor: "pointer",
                    background: filter === f.id ? P.dark : P.sage,
                    color: filter === f.id ? P.white : P.dark,
                    fontSize: 12, fontWeight: 700,
                  }}>{f.l}</div>
              ))}
            </div>
            <select value={sort} onChange={e => setSort(e.target.value)}
              style={{
                padding: "10px 14px", border: `2px solid ${P.sage}`,
                borderRadius: 10, fontSize: 12, color: P.dark,
                fontWeight: 700, outline: "none", cursor: "pointer",
              }}>
              <option value="id">Сорт: по ID</option>
              <option value="name">Сорт: по имени</option>
              <option value="health">Сорт: по здоровью</option>
            </select>
          </div>

          {/* Список */}
          {list.length === 0 ? (
            <div style={{
              background: P.white, borderRadius: 16, padding: 40, textAlign: "center",
              color: P.gray, fontSize: 14,
            }}>
              🔍 Ничего не найдено
            </div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16 }}>
              {list.map(c => (
                <div key={c.id} onClick={() => { setCow(c); setTab("vitals"); }}
                  style={{
                    background: P.white, borderRadius: 16, padding: 20,
                    cursor: "pointer", boxShadow: "0 2px 12px rgba(61,90,74,0.06)",
                    borderTop: `4px solid ${c.inside ? P.green : P.red}`,
                    transition: "transform 0.2s",
                  }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                    <div>
                      <div style={{ fontSize: 16, fontWeight: 700, color: P.dark }}>
                        #{c.id} {c.name}
                      </div>
                      <div style={{ fontSize: 11, color: P.gray, marginTop: 2 }}>
                        {c.breed} · {c.age}
                      </div>
                    </div>
                    <div style={{
                      fontSize: 10, fontWeight: 700, color: P.white, padding: "4px 10px",
                      borderRadius: 10, background: c.inside ? P.green : P.red, height: "fit-content",
                    }}>{c.inside ? "В ЗАГОНЕ" : "ВНЕ"}</div>
                  </div>
                  <div style={{ display: "flex", gap: 12, fontSize: 12, color: P.gray }}>
                    <span>❤ {c.vitals.hr}</span>
                    <span>🌡 {c.vitals.temp}°C</span>
                    <span>🩺 {c.health.score}</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {addOpen && <AddCowModal
          onClose={() => setAddOpen(false)}
          onAdd={data => {
            onAddCow({ ...data, herdId: herd.id });
            setAddOpen(false);
            showToast(`Корова ${data.name} добавлена`, "success");
          }}
        />}
      </div>
    );
  }

  // Общий список стад
  return (
    <div style={{ background: P.bg, minHeight: "100vh", padding: "40px" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        <div style={{ fontSize: 32, fontWeight: 800, color: P.dark, marginBottom: 8 }}>Дашборд</div>
        <div style={{ fontSize: 14, color: P.gray, marginBottom: 32 }}>
          Выберите стадо для просмотра животных
        </div>

        {cows.filter(c => !c.inside).length > 0 && (
          <div style={{
            background: P.peach, borderRadius: 16, padding: 20, marginBottom: 24,
            borderLeft: `5px solid ${P.red}`,
          }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: P.dark, marginBottom: 8 }}>
              ⚠️ Требуют внимания ({cows.filter(c => !c.inside).length})
            </div>
            <div style={{ fontSize: 13, color: P.dark }}>
              {cows.filter(c => !c.inside).map(c => `#${c.id} ${c.name}`).join(", ")} — вне загона
            </div>
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16 }}>
          {herds.map(h => {
            const inHerd = cows.filter(c => c.herdId === h.id);
            const alerts = inHerd.filter(c => !c.inside || c.health.score < 70).length;
            return (
              <div key={h.id} onClick={() => setHerd(h)}
                style={{
                  background: h.accent, borderRadius: 20, padding: 24,
                  cursor: "pointer", boxShadow: "0 4px 16px rgba(61,90,74,0.08)",
                  transition: "transform 0.2s",
                }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start" }}>
                  <div>
                    <div style={{ fontSize: 22, fontWeight: 800, color: P.dark }}>{h.name}</div>
                    <div style={{ fontSize: 13, color: P.dark, opacity: 0.75, marginTop: 8 }}>
                      📍 {h.location}
                    </div>
                  </div>
                  <div style={{ fontSize: 40 }}>🐄</div>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 20 }}>
                  <div>
                    <div style={{ fontSize: 28, fontWeight: 800, color: P.dark }}>{inHerd.length || h.count}</div>
                    <div style={{ fontSize: 11, color: P.dark, opacity: 0.7 }}>голов</div>
                  </div>
                  {alerts > 0 && (
                    <div style={{
                      background: P.white, padding: "6px 12px", borderRadius: 10,
                      fontSize: 11, fontWeight: 700, color: P.red, height: "fit-content",
                    }}>⚠ {alerts}</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ================= ФОРМА ДОБАВЛЕНИЯ КОРОВЫ =================
function AddCowModal({ onClose, onAdd }) {
  const [name, setName] = useState("");
  const [breed, setBreed] = useState("Голштинская");
  const [earTag, setEarTag] = useState("");
  const [age, setAge] = useState("");
  const [weight, setWeight] = useState(500);

  const handleSubmit = () => {
    if (!name || !earTag) return;
    onAdd({
      id: Math.floor(Math.random() * 900) + 200,
      name, breed, earTag, age: age || "2 года", weight,
      inside: true, lat: 55.7558, lon: 37.6173,
      vitals: { hr: 70, resp: 24, temp: 38.6, rum: 480, act: 50, hrv: 30 },
      health: { score: 85, risks: [], meds: [] },
      vax: [],
      collar: { id: "NEW" + Math.floor(Math.random() * 1000), battery: 3800, signal: 4, lastSync: "1 мин", firmware: "v1.0" },
      stats: { week: [50,50,50,50,50,50,50], month: Array(30).fill(50), half: Array(30).fill(50), year: Array(12).fill(50) },
    });
  };

  return (
    <Modal title="➕ Добавить корову" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div>
          <label style={{ fontSize: 12, fontWeight: 700, color: P.dark, display: "block", marginBottom: 6 }}>
            Кличка *
          </label>
          <input value={name} onChange={e => setName(e.target.value)}
            placeholder="Например, Ромашка"
            style={{
              width: "100%", padding: "10px 14px", border: `2px solid ${P.sage}`,
              borderRadius: 10, fontSize: 13, outline: "none", color: P.dark,
            }} />
        </div>
        <div>
          <label style={{ fontSize: 12, fontWeight: 700, color: P.dark, display: "block", marginBottom: 6 }}>
            Порода
          </label>
          <select value={breed} onChange={e => setBreed(e.target.value)}
            style={{
              width: "100%", padding: "10px 14px", border: `2px solid ${P.sage}`,
              borderRadius: 10, fontSize: 13, outline: "none", color: P.dark,
              cursor: "pointer",
            }}>
            <option>Голштинская</option>
            <option>Симментальская</option>
            <option>Чёрно-пёстрая</option>
            <option>Айрширская</option>
            <option>Красная степная</option>
          </select>
        </div>
        <div>
          <label style={{ fontSize: 12, fontWeight: 700, color: P.dark, display: "block", marginBottom: 6 }}>
            Номер бирки *
          </label>
          <input value={earTag} onChange={e => setEarTag(e.target.value)}
            placeholder="RU-00106"
            style={{
              width: "100%", padding: "10px 14px", border: `2px solid ${P.sage}`,
              borderRadius: 10, fontSize: 13, outline: "none", color: P.dark,
            }} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <div>
            <label style={{ fontSize: 12, fontWeight: 700, color: P.dark, display: "block", marginBottom: 6 }}>
              Возраст
            </label>
            <input value={age} onChange={e => setAge(e.target.value)}
              placeholder="3 года"
              style={{
                width: "100%", padding: "10px 14px", border: `2px solid ${P.sage}`,
                borderRadius: 10, fontSize: 13, outline: "none", color: P.dark,
              }} />
          </div>
          <div>
            <label style={{ fontSize: 12, fontWeight: 700, color: P.dark, display: "block", marginBottom: 6 }}>
              Вес, кг: <b>{weight}</b>
            </label>
            <input type="range" min={200} max={900} value={weight}
              onChange={e => setWeight(+e.target.value)}
              style={{ width: "100%", accentColor: P.dark }} />
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <button onClick={onClose} style={{
            flex: 1, padding: 14, background: P.sage, color: P.dark,
            border: "none", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer",
          }}>Отмена</button>
          <button onClick={handleSubmit} disabled={!name || !earTag} style={{
            flex: 2, padding: 14, background: name && earTag ? P.dark : P.gray,
            color: P.white, border: "none", borderRadius: 10, fontWeight: 700,
            fontSize: 13, cursor: name && earTag ? "pointer" : "not-allowed",
          }}>Добавить</button>
        </div>
      </div>
    </Modal>
  );
}

