function TabVax({ cow, onUpdate, showToast }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [date, setDate] = useState("");
  const [until, setUntil] = useState("");

  const handleAdd = () => {
    if (!name || !date || !until) return;
    const today = new Date().toISOString().split("T")[0];
    let status = "valid";
    if (until < today) status = "expired";
    else if (new Date(until) - new Date() < 30 * 24 * 3600 * 1000) status = "expiring";
    const updated = {
      ...cow,
      vax: [...cow.vax, { n: name, d: date, u: until, s: status }],
    };
    onUpdate(updated);
    setOpen(false);
    setName(""); setDate(""); setUntil("");
    showToast("Прививка добавлена", "success");
  };

  return (
    <div>
      <div style={{
        background: P.white, borderRadius: 16, padding: 20, marginBottom: 16,
        display: "flex", justifyContent: "space-around",
      }}>
        {[
          { l: "Всего",      v: cow.vax.length, c: P.dark },
          { l: "Активны",    v: cow.vax.filter(x => x.s === "valid").length, c: P.green },
          { l: "Истекают",   v: cow.vax.filter(x => x.s === "expiring").length, c: P.amber },
          { l: "Просрочены", v: cow.vax.filter(x => x.s === "expired").length, c: P.red },
        ].map((s, i) => (
          <div key={i} style={{ textAlign: "center" }}>
            <div style={{ fontSize: 32, fontWeight: 800, color: s.c }}>{s.v}</div>
            <div style={{ fontSize: 11, color: P.gray }}>{s.l}</div>
          </div>
        ))}
      </div>
      {cow.vax.map((v, i) => {
        const s = vaxStatus(v.s);
        return (
          <div key={i} style={{
            background: P.white, borderRadius: 16, padding: 20, marginBottom: 10,
            borderLeft: `5px solid ${s.c}`,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: P.dark }}>💉 {v.n}</div>
              <div style={{
                fontSize: 11, fontWeight: 700, color: P.white,
                padding: "4px 12px", borderRadius: 10, background: s.c,
              }}>{s.t}</div>
            </div>
            <div style={{ fontSize: 12, color: P.gray, marginTop: 8 }}>
              Сделана: {v.d} · Действует до: <b style={{ color: s.c }}>{v.u}</b>
            </div>
          </div>
        );
      })}
      <button onClick={() => setOpen(true)} style={{
        width: "100%", padding: 14, marginTop: 10, background: P.mint,
        color: P.dark, border: "none", borderRadius: 12, fontWeight: 700,
        fontSize: 14, cursor: "pointer",
      }}>+ Добавить прививку</button>

      {open && (
        <Modal title="💉 Новая прививка" onClose={() => setOpen(false)}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div>
              <label style={{ fontSize: 12, fontWeight: 700, color: P.dark, display: "block", marginBottom: 6 }}>
                Название *
              </label>
              <input value={name} onChange={e => setName(e.target.value)}
                placeholder="Ящур, Пастереллёз..."
                style={{
                  width: "100%", padding: "10px 14px", border: `2px solid ${P.sage}`,
                  borderRadius: 10, fontSize: 13, outline: "none", color: P.dark,
                }} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <div>
                <label style={{ fontSize: 12, fontWeight: 700, color: P.dark, display: "block", marginBottom: 6 }}>
                  Дата вакцинации *
                </label>
                <input type="date" value={date} onChange={e => setDate(e.target.value)}
                  style={{
                    width: "100%", padding: "10px 14px", border: `2px solid ${P.sage}`,
                    borderRadius: 10, fontSize: 13, outline: "none", color: P.dark,
                  }} />
              </div>
              <div>
                <label style={{ fontSize: 12, fontWeight: 700, color: P.dark, display: "block", marginBottom: 6 }}>
                  Действует до *
                </label>
                <input type="date" value={until} onChange={e => setUntil(e.target.value)}
                  style={{
                    width: "100%", padding: "10px 14px", border: `2px solid ${P.sage}`,
                    borderRadius: 10, fontSize: 13, outline: "none", color: P.dark,
                  }} />
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button onClick={() => setOpen(false)} style={{
                flex: 1, padding: 14, background: P.sage, color: P.dark,
                border: "none", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer",
              }}>Отмена</button>
              <button onClick={handleAdd} disabled={!name || !date || !until} style={{
                flex: 2, padding: 14, background: name && date && until ? P.dark : P.gray,
                color: P.white, border: "none", borderRadius: 10, fontWeight: 700,
                fontSize: 13, cursor: name && date && until ? "pointer" : "not-allowed",
              }}>Сохранить</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

