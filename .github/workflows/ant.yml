// ================= ГЛАВНЫЙ =================
export default function App() {
  const [page, setPage] = useState("home");
  const [cows, setCows] = useState(INITIAL_COWS);
  const [toast, setToast] = useState(null);
  const [bellOpen, setBellOpen] = useState(false);
  const [lastUpdate, setLastUpdate] = useState("Только что");
  const [refreshing, setRefreshing] = useState(false);

  const showToast = (msg, type = "info") => setToast({ msg, type });

  const notifications = [
    ...(cows.filter(c => !c.inside).length > 0 ? [{
      icon: "⚠️", title: `${cows.filter(c => !c.inside).length} коров вне загона`,
      time: "5 минут назад",
    }] : []),
    ...(cows.filter(c => c.health.score < 70).length > 0 ? [{
      icon: "🩺", title: `${cows.filter(c => c.health.score < 70).length} коров требуют ветеринара`,
      time: "12 минут назад",
    }] : []),
    ...(cows.flatMap(c => c.vax.filter(v => v.s === "expired")).length > 0 ? [{
      icon: "💉", title: "Просроченные прививки",
      time: "1 час назад",
    }] : []),
    { icon: "🔋", title: "Ошейник #A3F3 разряжен (3700 мВ)", time: "2 часа назад" },
  ];

  const handleRefresh = () => {
    setRefreshing(true);
    setTimeout(() => {
      setRefreshing(false);
      setLastUpdate("Только что");
      showToast("Данные обновлены", "success");
    }, 1200);
  };

  const handleAddCow = (data) => {
    setCows([...cows, data]);
  };

  return (
    <div style={{ fontFamily: "Inter, sans-serif", minHeight: "100vh", position: "relative" }}>
      <Header
        page={page} setPage={setPage}
        notifications={notifications}
        bellOpen={bellOpen}
        onBellClick={() => setBellOpen(!bellOpen)}
        onRefresh={handleRefresh}
        lastUpdate={lastUpdate}
        refreshing={refreshing}
      />
      {bellOpen && (
        <>
          <div onClick={() => setBellOpen(false)} style={{
            position: "fixed", inset: 0, zIndex: 150,
          }} />
          <NotificationsPanel notifications={notifications} onClose={() => setBellOpen(false)} />
        </>
      )}

      {page === "home" && <PageHome setPage={setPage} />}
      {page === "dashboard" && (
        <PageDashboard
          cows={cows} herds={INITIAL_HERDS}
          onAddCow={handleAddCow}
          showToast={showToast}
        />
      )}
      {page === "stats" && <PageStats cows={cows} showToast={showToast} />}
      {page === "about" && <PageAbout />}

      {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
    </div>
  );
}
