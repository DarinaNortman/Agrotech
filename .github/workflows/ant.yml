            width: 36, height: 36, borderRadius: 10, background: P.white,
            border: "none", fontSize: 18, fontWeight: 700, cursor: "pointer",
            boxShadow: "0 2px 8px rgba(0,0,0,0.15)", color: P.dark,
          }}>−</button>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ background: P.white, borderRadius: 16, padding: 20 }}>
          <div style={{ fontSize: 11, color: P.gray }}>Координаты</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: P.dark, marginTop: 4 }}>
            {cow.lat.toFixed(4)}<br />{cow.lon.toFixed(4)}
          </div>
        </div>
        <div style={{ background: cow.inside ? P.mint : P.peach, borderRadius: 16, padding: 20 }}>
          <div style={{ fontSize: 11, color: P.dark, opacity: 0.7 }}>Статус</div>
          <div style={{ fontSize: 20, fontWeight: 800, color: P.dark, marginTop: 4 }}>
            {cow.inside ? "✓ Внутри" : "⚠ Вне загона"}
          </div>
        </div>
        <div style={{ background: P.white, borderRadius: 16, padding: 20 }}>
          <div style={{ fontSize: 11, color: P.gray }}>Зум</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: P.dark, marginTop: 4 }}>
            {zoom.toFixed(1)}×
          </div>
        </div>
      </div>
    </div>
  );
}

