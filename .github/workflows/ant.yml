const norms = {
  hr:   { min: 48, max: 84, l: "уд/мин" },
  resp: { min: 10, max: 30, l: "дых/мин" },
  temp: { min: 38.0, max: 39.3, l: "°C" },
  rum:  { min: 400, max: 600, l: "мин/день" },
  act:  { min: 20, max: 200, l: "шаг/мин" },
  hrv:  { min: 25, max: 60, l: "мс" },
};
const vStatus = (k, v) => {
  const n = norms[k]; if (!n) return { c: P.gray, t: "—" };
  if (v < n.min) return { c: P.amber, t: "↓" };
  if (v > n.max) return { c: P.red, t: "↑" };
  return { c: P.green, t: "✓" };
};
const vaxStatus = s => ({
  valid:    { c: P.green, t: "Активна" },
  expiring: { c: P.amber, t: "Истекает" },
  expired:  { c: P.red, t: "Просрочена" },
}[s] || { c: P.gray, t: "—" });

// ================= TOAST =================
function Toast({ msg, type, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, 3000);
    return () => clearTimeout(t);
  }, [onClose]);
  const bg = { success: P.green, error: P.red, info: P.blue, warning: P.amber }[type] || P.dark;
  return (
    <div style={{
      position: "fixed", bottom: 24, right: 24, zIndex: 9999,
      background: bg, color: P.white, padding: "14px 20px", borderRadius: 12,
      boxShadow: "0 8px 24px rgba(0,0,0,0.2)", fontWeight: 600, fontSize: 13,
      display: "flex", alignItems: "center", gap: 12, minWidth: 260,
    }}>
      <span style={{ fontSize: 18 }}>
        {type === "success" ? "✓" : type === "error" ? "✕" : type === "warning" ? "⚠" : "ℹ"}
      </span>
      {msg}
    </div>
  );
}

// ================= МОДАЛЬНОЕ ОКНО =================
function Modal({ title, onClose, children, width = 500 }) {
  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
      display: "flex", alignItems: "center", justifyContent: "center",
      zIndex: 9998, padding: 20,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: P.white, borderRadius: 20, padding: 28, width, maxWidth: "100%",
        maxHeight: "90vh", overflow: "auto", boxShadow: "0 20px 60px rgba(0,0,0,0.3)",
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 20, fontWeight: 800, color: P.dark }}>{title}</div>
          <div onClick={onClose} style={{
            cursor: "pointer", fontSize: 22, color: P.gray,
            width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center",
            borderRadius: 8,
          }}>×</div>
        </div>
        {children}
      </div>
    </div>
  );
}

